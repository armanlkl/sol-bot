name: SOL Bot 15Min
on:
  schedule:
    - cron: '*/15 * * * *'  # هر ۱۵ دقیقه یک‌بار خودکار اجرا می‌شود
  workflow_dispatch:      # دکمه اجرای دستی

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install yfinance pandas pandas_ta requests
      - name: Run Bot Script
        run: python bot.py
